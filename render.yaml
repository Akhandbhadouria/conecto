databases:
  - name: tweet-db
    databaseName: tweet
    user: tweet

services:
  - type: redis
    name: tweet-redis
    ipAllowList: []

  - type: web
    name: django-tweet-ml
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne tax_fare_django.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: tweet-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: tweet-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
